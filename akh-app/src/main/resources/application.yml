# ============================================================
# AI Knowledge Hub — 主配置（Step 0.2 骨架版）
# 分环境配置在 Step 0.7 落地：application-local.yml / -dev.yml / -prod.yml
# 所有敏感值与连接信息一律来自环境变量（见 .env.example）
# ============================================================
spring:
  application:
    name: ai-knowledge-hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true   # Java 21 虚拟线程：IO 密集（模型调用 / 检索）收益明显

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ============================================================
# JWT 配置
# secret 必须由环境变量 JWT_SECRET 提供（UTF-8 下至少 32 字节）。
# 这里刻意不给默认值：缺失时应用启动即失败（fail-fast），
# 避免开发期的弱密钥被带到生产环境——那意味着任何人都能伪造合法 Token。
# 生成示例（PowerShell）：
#   [Convert]::ToBase64String((1..48 | ForEach-Object {Get-Random -Max 256}))
# ============================================================
akh:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ai-knowledge-hub
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}

logging:
  # 日志模板里带上 MDC 中的 requestId（由 RequestIdFilter 写入）：
  # 排查问题时只需用户提供响应头 X-Request-Id，即可捞出该请求的全部日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{40} - %msg%n"
  level:
    root: INFO
    com.lky.akh: DEBUG
