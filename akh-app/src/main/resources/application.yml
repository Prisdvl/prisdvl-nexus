# ============================================================
# AI Knowledge Hub — 主配置（Step 0.2 骨架版）
# 分环境配置在 Step 0.7 落地：application-local.yml / -dev.yml / -prod.yml
# 所有敏感值与连接信息一律来自环境变量（见 .env.example）
# ============================================================
spring:
  application:
    name: ai-knowledge-hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true   # Java 21 虚拟线程：IO 密集（模型调用 / 检索）收益明显

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  # 日志模板里带上 MDC 中的 requestId（由 RequestIdFilter 写入）：
  # 排查问题时只需用户提供响应头 X-Request-Id，即可捞出该请求的全部日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{40} - %msg%n"
  level:
    root: INFO
    com.lky.akh: DEBUG
