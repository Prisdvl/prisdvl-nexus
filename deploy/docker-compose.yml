# ============================================================
# prisdvl-nexus 单机编排（Phase 5.7）
#
#   前置（后端镜像只运行、不构建，见 deploy/backend/Dockerfile）：
#     JAVA_HOME=<jdk-21> mvn -B package -DskipTests
#     cp deploy/.env.example deploy/.env && 填 JWT_SECRET / AI_CHAT_API_KEY
#
#   cd deploy
#   docker compose config            # 校验配置与变量替换（含"缺 secret 直接失败"）
#   docker compose build             # 构建 backend / frontend（ES 镜像首次也要构建）
#   docker compose up -d             # 启动全部 7 个服务
#   docker compose ps                # 看健康状态（要看到 healthy，不是仅 Up）
#   docker compose logs -f backend   # 看某个服务日志
#   docker compose restart backend   # 重启（数据不丢）
#   docker compose down              # 停止并删除容器（**保留数据卷**）
#   docker compose down -v           # 停止并删除数据卷（清库，慎用）
#
# 【端口策略：谁能从宿主机访问】
#   只有 frontend 监听 0.0.0.0（8088）——它是唯一对局域网/公网开放的入口。
#   其余端口（含 backend 的 8080）全部绑定到 127.0.0.1，也就是**只有本机能连**：
#   保留"宿主机直接跑 java -jar / 直连后端调试"的开发方式，
#   但不把这些无认证的服务暴露到局域网/公网。
#   基础设施的认证一律不设默认口令之外的加固（见 docs/deployment.md 生产清单）。
#   容器间只有 nginx 访问 backend；宿主机调试可直连 127.0.0.1:8080，或走
#     docker compose exec backend curl -s localhost:8080/actuator/health
#
# 【容器内一律用 service name】
#   mysql:3306 / postgres:5432 / redis:6379 / rabbitmq:5672 /
#   elasticsearch:9200
#   注意端口是**容器内**的端口：PostgreSQL 在宿主机映射成 5433，容器内仍是 5432。
#
# 【镜像版本】均按官方源核对过，依据见 docs/decisions.md 附录 B.4
# ============================================================
name: nexus

services:

  # ----------------------------------------------------------------
  # MySQL：业务真源（用户/知识库/文档/Chunk/会话/消息/评测/观测）
  # ----------------------------------------------------------------
  mysql:
    image: mysql:8.4.11
    container_name: nexus-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXUS_MYSQL_ROOT_PASSWORD:-nexus_root_pwd}
      MYSQL_DATABASE: ${NEXUS_MYSQL_DATABASE:-nexus}
      MYSQL_USER: ${NEXUS_MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${NEXUS_MYSQL_PASSWORD:-nexus_pwd}
      TZ: Asia/Shanghai
    command:
      # 显式指定字符集（中文笔记必须 utf8mb4）；顺手把缓冲池调小以适配 Docker VM 的 7.6GB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${NEXUS_MYSQL_ROOT_PASSWORD:-nexus_root_pwd}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [nexus-net]

  # ----------------------------------------------------------------
  # PostgreSQL + pgvector：向量索引（Phase 3）
  # 用 pgvector 官方镜像，pg18 与生产目标一致
  # ----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: nexus-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_PG_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${NEXUS_PG_DATABASE:-nexus_vector}
      POSTGRES_USER: ${NEXUS_PG_USER:-nexus}
      POSTGRES_PASSWORD: ${NEXUS_PG_PASSWORD:-nexus_pwd}
      TZ: Asia/Shanghai
    volumes:
      # 注意：PostgreSQL 18+ 的官方镜像改了数据目录布局。
      # v18 起必须把**单个卷挂在 /var/lib/postgresql**（数据落在 <mount>/18/docker），
      # 仍然挂 /var/lib/postgresql/data 会导致容器启动即失败并进入重启循环，报错：
      #   "in 18+, these Docker images are configured to store database data in a format
      #    which is compatible with pg_ctlcluster ... place a single mount at /var/lib/postgresql"
      # 这样改也能让未来 pg_upgrade --link 不受挂载点边界影响。
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXUS_PG_USER:-nexus} -d ${NEXUS_PG_DATABASE:-nexus_vector}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [nexus-net]

  # ----------------------------------------------------------------
  # Redis：令牌版本 / 登录失败计数 / 限流 / 每日配额（Phase 5.6 起）
  # Redis 8 已内建 Query Engine 与 JSON，不需要 redis-stack
  #
  # ⚠️ maxmemory-policy = allkeys-lru：内存吃紧时会**淘汰这些计数键**，
  # 表现为"当日配额被重置、限流漏掉几次"。它是有意的取舍（宁可少限几次，
  # 也不要 Redis 写满把写入也拖垮），但意味着配额不是硬保证。
  # 要做到硬保证得把当日用量落库（见 docs/archive/reports/productization-gap-analysis.md P2-17）。
  # 另外：应用侧靠 nexus.security.redis-enabled 决定用不用它，关掉时走进程内存。
  # ----------------------------------------------------------------
  redis:
    image: redis:8.10.2
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [nexus-net]

  # ----------------------------------------------------------------
  # Elasticsearch + IK 中文分词：BM25 关键词检索（Phase 3）
  # IK 插件版本必须与 ES 完全一致，因此用本地 Dockerfile 安装
  # ----------------------------------------------------------------
  elasticsearch:
    build:
      context: ./elasticsearch
      args:
        ES_VERSION: ${NEXUS_ES_VERSION:-9.4.5}
    image: nexus-elasticsearch:${NEXUS_ES_VERSION:-9.4.5}
    container_name: nexus-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_ES_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      # 开发环境关闭安全模块。生产必须开启（Phase 11）
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # Docker VM 只有 7.6GB，ES 堆必须压小
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [nexus-net]

  # ----------------------------------------------------------------
  # RabbitMQ：异步导入 / 批量嵌入 / 评测 / 报告（Phase 2、9）
  # 3.x 已 EOL，故使用 4.3 线
  # ----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: nexus-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${NEXUS_RABBITMQ_CONSOLE_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${NEXUS_RABBITMQ_USER:-nexus}
      RABBITMQ_DEFAULT_PASS: ${NEXUS_RABBITMQ_PASSWORD:-nexus_pwd}
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [nexus-net]

  # ----------------------------------------------------------------
  # （原 ollama 服务已移除：嵌入切到阿里云百炼 text-embedding-v4，见 backend 环境变量。）
  # 本地 bge-m3 方案若要恢复：把这段 ollama: 服务加回，再把 backend 的
  # AI_EMBEDDING_BASE_URL 改回 http://ollama:11434，并在 application.yml 加 ollama provider。
  # ----------------------------------------------------------------

  # ----------------------------------------------------------------
  # backend：Spring Boot 单体（java -jar）
  #
  # 【端口只绑回环】容器间由 nginx 经 backend:8080 访问；宿主机调试可直连
  #   127.0.0.1:8080/actuator/health，或走入口 http://localhost:8088/api/...
  # 不绑 0.0.0.0：无认证的后端不暴露到局域网/公网。
  #
  # 【depends_on 为什么用 condition: service_healthy】
  # 需求里那句"不要简单 depends_on 就假设服务已经可用"说的是默认的
  # service_started：那个只保证容器**进程**起了。这里全部用 service_healthy，
  # 即等到对方健康检查真的通过（MySQL 能 ping、PG 能 pg_isready、ES 返回
  # cluster health、RabbitMQ 能 ping）才启动。
  # 之所以不需要再加应用侧重试：本项目在连不上时是 fail-fast（Flyway 迁移失败
  # 直接退出，由 restart: unless-stopped 拉起），所以"起来之前先确认依赖活着"
  # 比"起来之后反复重连"更符合它的既有语义。
  # ----------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: nexus-backend:${NEXUS_APP_VERSION:-0.0.1}
    container_name: nexus-backend
    restart: unless-stopped
    depends_on:
      mysql:         { condition: service_healthy }
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      # ollama 已移除：嵌入走云端百炼，不依赖本地容器。
    ports: 
        - "127.0.0.1:8080:8080"
    environment:
      # 单机真实基础设施 = 本项目既有的 local profile（Flyway 开、Redis 限流开）。
      # 它不是"生产 profile"——生产（外置密钥、ES 开安全、多实例）见 Phase 11。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      TZ: Asia/Shanghai

      # ---- MySQL：容器内 host 是 service name，端口是**容器端口** 3306 ----
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${NEXUS_MYSQL_DATABASE:-nexus}
      MYSQL_USERNAME: ${NEXUS_MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${NEXUS_MYSQL_PASSWORD:-nexus_pwd}

      # ---- PG + pgvector：宿主机是 5433，容器内是 5432 ----
      NEXUS_VECTOR_ENABLED: "true"
      NEXUS_VECTOR_URL: jdbc:postgresql://postgres:5432/${NEXUS_PG_DATABASE:-nexus_vector}
      NEXUS_VECTOR_USER: ${NEXUS_PG_USER:-nexus}
      NEXUS_VECTOR_PASSWORD: ${NEXUS_PG_PASSWORD:-nexus_pwd}

      # ---- ES ----
      NEXUS_SEARCH_ENABLED: "true"
      NEXUS_ES_URIS: http://elasticsearch:9200

      # ---- Redis / RabbitMQ ----
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${NEXUS_RABBITMQ_USER:-nexus}
      RABBITMQ_PASSWORD: ${NEXUS_RABBITMQ_PASSWORD:-nexus_pwd}

      # ---- 落库凭据的字段级加密（P1 凭证安全）----
      # 必须显式透传：容器不会自己读到宿主机的环境变量。
      # 默认空 = 未配置 ⇒ 保存「模型 Key」会 fail-closed（9999），**不会**静默存明文。
      # 生成与注意事项见仓库根 .env.example（deploy/.env 里设同名的 NEXUS_SECURITY_CRYPTO_KEK）。
      NEXUS_SECURITY_CRYPTO_KEK: ${NEXUS_SECURITY_CRYPTO_KEK:-}

      # ---- 模型：嵌入走阿里云百炼（DashScope compatible-mode），对话走外部网关 ----
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v4}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-1024}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:?AI_EMBEDDING_API_KEY 未配置：请在 deploy/.env 里填入 DashScope API-KEY}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://opencode.ai/zen/go/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-v4-flash}
      AI_JUDGE_MODEL: ${AI_JUDGE_MODEL:-glm-5.3-flash}

      # ---- 敏感值：一律来自 deploy/.env，且**缺失即失败** ----
      # `:?` 的语义：变量未设置或为空时，docker compose 直接报错退出，
      # 连容器都不会创建。这是把 nexus.jwt.secret 的 fail-closed 语义
      # 前移到编排层——否则 application-local.yml 里那个开发默认密钥会兜住它，
      # 于是"忘了配密钥"表现为"启动成功、密钥是仓库里人尽皆知的那个"。
      # 注意 `.env` 在 .gitignore 里（`deploy/.env` 同理），不进版本库。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未配置：请复制 deploy/.env.example 为 deploy/.env 并填入至少 32 字节的随机值}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:?AI_CHAT_API_KEY 未配置：请复制 deploy/.env.example 为 deploy/.env 并填入模型网关的 Key}

      # ---- 邮件（Resend / console / smtp）----
      # 默认 console（local profile 一致，验证码进容器日志）。
      # 真邮：宿主机设 RESEND_API_KEY（系统环境变量即可，勿写入仓库），
      # 并在 deploy/.env 设 NEXUS_EMAIL_SENDER=resend + NEXUS_EMAIL_RESEND_FROM。
      # compose 会把宿主机/同目录 .env 中的变量注入容器；Key 缺失且 sender=resend 时应用启动失败。
      NEXUS_EMAIL_SENDER: ${NEXUS_EMAIL_SENDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NEXUS_EMAIL_RESEND_FROM: ${NEXUS_EMAIL_RESEND_FROM:-}

      # ---- 存储：原始文件（增量同步要重新解析原文）----
      NEXUS_STORAGE_ROOT: /app/data
    volumes:
      # 不挂卷的话 docker compose down 会把上传的原文一起带走，
      # 而 MySQL 里还留着指向它们的记录（"文档存在但打不开"）
      - backend-data:/app/data
    healthcheck:
      # /actuator/health 在 SecurityConfig 里是公开的；默认含 DataSource 探针，
      # 所以这个健康检查同时证明了"进程活着"和"MySQL 连得上"
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s   # server.shutdown=graceful：给在途 SSE 请求收尾的时间
    networks: [nexus-net]

  # ----------------------------------------------------------------
  # frontend：Nginx（静态资源 + /api 反代）
  #
  # 【没有 depends_on backend】不是漏了：
  # nginx 启动不需要后端在（它只是转发），且 nginx.conf 用 resolver + 变量
  # 每次请求重解析 backend 的地址，所以后端晚起/重建都会自愈（先是 502，
  # 起来后立刻正常）。反过来加 depends_on 只会让"后端暂时不健康"拖住整个前端。
  # ----------------------------------------------------------------
  frontend:
    build:
      # 前端已合并为目录 frontend/（原 Vue 版 web/ 与 React 迁移版 web-react/ 已归档到 docs/archive/）
      context: ../frontend
      dockerfile: Dockerfile
    image: nexus-frontend:${NEXUS_APP_VERSION:-0.0.1}
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      # 唯一的对外入口。要改端口只改 .env 里的 NEXUS_FRONTEND_PORT
      - "${NEXUS_FRONTEND_PORT:-8088}:80"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      # 打 /healthz（nginx.conf 里的静态探针），不打 `/`：
      # `/` 会被 SPA fallback 接管，哪怕 dist 丢了也返回 index.html
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [nexus-net]

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  es-data:
  rabbitmq-data:
  backend-data:

networks:
  nexus-net:
    driver: bridge
