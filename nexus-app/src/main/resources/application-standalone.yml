# ============================================================
# standalone —— 不依赖任何外部基础设施的开发 profile
#
# 用途：在 Docker / MySQL / Redis 尚未就绪时，也能把整应用跑起来调接口、连前端。
#   mvn -pl nexus-app spring-boot:run -Dspring-boot.run.profiles=standalone
#
# 表结构由 Flyway 迁移（src/main/resources/db/migration）建——与 local（MySQL）用同一套脚本，
# 因此在 standalone 上验证过的字段/索引就是 MySQL 上那一套（H2 以 MODE=MySQL 执行）。
# 与 test profile 共用的 db/h2/schema.sql 实测已成空操作（复核见 Phase 4.1 的启动日志，
# 详见 docs/platform-phase3-baseline.md §1.7），保留只为最小改动。
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:nexus_standalone;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # ⚠️ 实测（复核于 Phase 4.1）：这份脚本不会生效，表实际是 Flyway 建的，见文件头的说明。
      schema-locations: classpath:db/h2/schema.sql
  flyway:
    # ⚠️ 同上：这个开关关不掉主库迁移（那是 PrimaryDataSourceConfig 手工声明的 Bean）。
    # 实测日志：Successfully applied 11 migrations to schema "public", now at version v12。
    # 迁移虽是 MySQL 方言，但在 H2 MODE=MySQL 下能跑通——所以 standalone 的表结构与 MySQL 一致，
    # 这是"本地能跑通就等于 MySQL 上也对"的依据。
    enabled: false
  h2:
    console:
      # 开启 H2 控制台，方便直接看表数据：http://localhost:8080/h2-console
      enabled: true
      path: /h2-console

# ------------------------------------------------------------
# 仅用于本地开发的 JWT 密钥。
# 注意：这与主配置"缺失即启动失败"的策略不同，是刻意的取舍——
# 开发 profile 要能一条命令跑起来，不能逼每个人先去配环境变量。
# 生产 profile 仍然不给默认值（见 application.yml）。
# ------------------------------------------------------------
nexus:
  jwt:
    secret: ${JWT_SECRET:standalone-only-dev-secret-do-not-use-in-production-32b}
  import:
    # 该 profile 的定位是"没有 Docker / 没有 broker 也能跑通全链路"，
    # 因此导入走同步执行；同时关掉 RabbitMQ 健康检查，
    # 否则 /actuator/health 会因为连不上 broker 而变成 DOWN（误报）。
    mode: sync
  vector:
    # 同理：没有 PostgreSQL，向量功能关闭（使用时明确报 4003）
    enabled: false
  search:
    # 同理：没有 Elasticsearch，关键词检索关闭
    enabled: false

management:
  health:
    rabbit:
      enabled: false

logging:
  level:
    com.lky.nexus: DEBUG
    # 想看清每次发给模型的完整 prompt 时可打开下面两行（默认关闭，避免日志过大/泄漏）
    # org.springframework.ai.chat.client: DEBUG
