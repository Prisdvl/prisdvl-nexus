# ============================================================
# Prisdvl-Nexus — 主配置（Step 0.2 骨架版）
# 分环境配置在 Step 0.7 落地：application-local.yml / -dev.yml / -prod.yml
# 所有敏感值与连接信息一律来自环境变量（见 .env.example）
# ============================================================
spring:
  application:
    name: prisdvl-nexus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true   # Java 21 虚拟线程：IO 密集（模型调用 / 检索）收益明显
  ai:
    model:
      # 关闭 Spring AI starter 的模型自动配置 —— 由 AiModelRegistry 手工构建多 provider 模型（ADR-003）。
      # 官方文档明确指出 chat 属性存在的目的就是"允许配置多个模型"；
      # 不关闭的话，starter 只会提供一个 ChatModel bean，无法满足
      # "对话模型 / Agent 模型 / 评测裁判模型 / 嵌入模型 分属不同供应商"的需求。
      #
      # 注意：必须把六个能力全部关掉。实测踩坑 —— 只关 chat 时，
      # OpenAiAudioSpeechAutoConfiguration 仍会尝试构建语音模型并因缺少凭证直接让上下文启动失败：
      #   "At least one credential source must be specified: credential (apiKey), ..."
      # 该清单由 spring-ai-autoconfigure-model-openai-2.0.1.jar 中各 AutoConfiguration 的
      # @ConditionalOnProperty 读出，不是猜的。
      chat: "none"
      embedding: "none"
      image: "none"
      audio:
        speech: "none"
        transcription: "none"
      moderation: "none"
    chat:
      memory:
        repository:
          jdbc:
            # 表结构由本项目自己拥有（H2: db/h2/schema.sql；MySQL: Flyway V3），统一设为 never。
            # 为什么不交给框架自动建表：
            #   框架的自动建表只对嵌入式库生效，若"H2 交给框架、MySQL 交给 Flyway"，
            #   就变成两套 DDL 来源——Spring AI 升级改了表结构时，
            #   H2 测试会跟着框架走而通过，MySQL 生产却因迁移脚本过时而失败。
            #   自己拥有 DDL 后，两边不一致会立刻在测试里暴露（详见 V3 迁移脚本注释）。
            initialize-schema: never

  servlet:
    multipart:
      # 默认只有 1MB —— 上传 Obsidian Vault 时必然超限，因此显式放大。
      # 注意：真正的安全限额在 VaultPackageExtractor（按"解压后"的条目数/字节数限制），
      # 这里的 multipart 上限只是第一道粗筛。
      max-file-size: 200MB
      max-request-size: 220MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexus}
    password: ${RABBITMQ_PASSWORD:nexus_pwd}
    listener:
      simple:
        acknowledge-mode: auto
        # 重试耗尽后不要无限重新入队（那会把 CPU 与日志打满，是 MQ 最常见的生产事故），
        # 而是交给死信交换机（拓扑见 RabbitImportConfig）
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s

  data:
    redis:
      # 限流 / 每日配额 / 令牌版本的存储（Phase 5.6）。
      # 这里只声明连接信息，用不用 Redis 由 nexus.security.redis-enabled 决定：
      #   local      → true（compose 里有 nexus-redis）
      #   standalone → false（该 profile 的定位就是"零外部基础设施"）
      #   test       → false
      # 关掉时走内存实现，此时这几个连接参数完全不会被读取。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 连接超时压短：它决定了"Redis 挂了"多久能被发现。
      # 默认值偏长，而这里的每次调用都在用户请求路径上（鉴权/限流），
      # 等 30 秒才降级等于把 Redis 的故障放大成整个应用不可用。
      connect-timeout: 2s
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ============================================================
# 观测（Phase 5.9 六）
# 只暴露 metrics，不引入任何指标后端：没有 Prometheus/Grafana，
# /actuator/metrics 是一份 JSON，够本项目的规模用。
#
# ⚠️ /actuator/metrics **不在** SecurityConfig 的公开列表里，
# 因此它要求 Authorization: Bearer <JWT>（与其余端点同一套身份）。
# 指标里虽然没有用户数据，但它会报出服务名、模型名与调用量——
# 一个个人部署的服务没有理由把这些公开给任何人。
# 健康检查保持公开（Docker healthcheck / 探针要用）。
# ============================================================
management:
  endpoints:
    web:
      exposure:
        # health 是 Spring Boot 4 的默认值，这里显式写出来是为了让"还放行了什么"一目了然
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # 让 /actuator/metrics/nexus.llm.latency 之类给出 p50/p95/p99，
      # 而不是只有 count/total/max —— 只看平均值看不出"少数请求特别慢"。
      # 客户端百分位（而不是直方图桶）：本项目没有 Prometheus，桶没有用处。
      percentiles:
        nexus.chat.latency: 0.5,0.95,0.99
        nexus.llm.latency: 0.5,0.95,0.99

# ============================================================
# JWT 配置
# secret 必须由环境变量 JWT_SECRET 提供（UTF-8 下至少 32 字节）。
# 这里刻意不给默认值：缺失时应用启动即失败（fail-fast），
# 避免开发期的弱密钥被带到生产环境——那意味着任何人都能伪造合法 Token。
# 生成示例（PowerShell）：
#   [Convert]::ToBase64String((1..48 | ForEach-Object {Get-Random -Max 256}))
# ============================================================
nexus:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: prisdvl-nexus
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    # Refresh token / 设备会话 TTL（Phase 4）。库中只存 hash，明文只在签发时返回一次。
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    # 令牌版本缓存的 TTL。它同时也是"失效失败时旧令牌还能活多久"的上限：
    # invalidate 抛异常的话，缓存里那条旧版本会继续被读到、直到过期
    # （DB 已是新值，所以下一次缓存 miss 就会纠正）。TTL 越短越安全、查库越多。
    token-version-cache-ttl: ${JWT_TOKEN_VERSION_CACHE_TTL:5m}
  # 两步验证（TOTP，RFC 6238）。无第三方依赖：HMAC-SHA1 走 JDK 自带算法。
  #
  # 只有 issuer 会离开服务端（写进 otpauth:// 里、显示在用户手机的验证器上），
  # 其余参数都是校验口径，改了会让已经绑定的账号登不进来 —— 变更必须配迁移说明。
  auth:
    totp:
      issuer: ${NEXUS_TOTP_ISSUER:Prisdvl Nexus}
      digits: ${NEXUS_TOTP_DIGITS:6}
      # 30 秒是 RFC 6238 推荐值，主流验证器（Google/1Password/Authy）都默认它。
      period-seconds: ${NEXUS_TOTP_PERIOD_SECONDS:30}
      # 前后各容忍 1 个时间步（约 ±30s 时钟漂移）。不能放大：
      # 每多一步，6 位码被猜中的概率就多 1/10^6。
      window: ${NEXUS_TOTP_WINDOW:1}
      # 一次下发多少枚一次性恢复码（只存 SHA-256，明文只在 enable 的响应里出现一次）。
      recovery-codes: ${NEXUS_TOTP_RECOVERY_CODES:10}
  # 邮箱验证码（Phase 1 基础设施 + Phase 2 已登录验邮）。
  # 默认 unconfigured：生产不会把明文验证码打进日志，也不会自动降级为 console。
  # local / standalone / test profile 覆盖为 console（仅开发）。
  # 生产发真信：NEXUS_EMAIL_SENDER=smtp|resend，凭据只用环境变量。
  email:
    sender: ${NEXUS_EMAIL_SENDER:unconfigured}
    code:
      length: ${NEXUS_EMAIL_CODE_LENGTH:6}
      expire: ${NEXUS_EMAIL_CODE_EXPIRE:5m}
      max-attempts: ${NEXUS_EMAIL_CODE_MAX_ATTEMPTS:5}
      cooldown: ${NEXUS_EMAIL_CODE_COOLDOWN:60s}
      # 同一 IP 每小时发送上限（走 RateLimiter 固定窗口）
      ip-per-hour: ${NEXUS_EMAIL_CODE_IP_PER_HOUR:30}
    smtp:
      host: ${NEXUS_EMAIL_SMTP_HOST:}
      port: ${NEXUS_EMAIL_SMTP_PORT:587}
      username: ${NEXUS_EMAIL_SMTP_USERNAME:}
      password: ${NEXUS_EMAIL_SMTP_PASSWORD:}
      from: ${NEXUS_EMAIL_SMTP_FROM:}
      start-tls: ${NEXUS_EMAIL_SMTP_START_TLS:true}
    resend:
      # API Key 仅环境变量；勿写入仓库。缺失且 sender=resend 时启动失败。
      api-key: ${RESEND_API_KEY:}
      from: ${NEXUS_EMAIL_RESEND_FROM:}
      base-url: ${NEXUS_EMAIL_RESEND_BASE_URL:https://api.resend.com}
      connect-timeout: ${NEXUS_EMAIL_RESEND_CONNECT_TIMEOUT:5s}
      read-timeout: ${NEXUS_EMAIL_RESEND_READ_TIMEOUT:15s}
  security:
    # 限流/配额/令牌版本存储用 Redis 还是进程内存。
    # 默认 **false** 是刻意的：内存实现让 standalone 与测试保持"零外部基础设施"，
    # 也让"忘了配 Redis"这件事表现为"单实例限流仍生效"，而不是启动失败。
    # ⚠️ 多实例部署必须置 true —— 内存实现每个实例各算一份，限流会被放大 N 倍。
    # 邮箱验证码存储（EmailCodeStore）共用同一开关。
    redis-enabled: ${NEXUS_SECURITY_REDIS_ENABLED:false}
    crypto:
      # 落库凭据（user_llm_config.api_key，将来还有 user_embedding_config）的字段级加密 KEK：
      # base64 的 16/24/32 字节（AES-128/192/256），由 CredentialCipher 使用（AES-GCM）。
      #
      # ⚠️ 默认空**不是"退化成明文存储"**，而是写入路径 fail-closed：保存模型 Key 会直接报 9999。
      # 静默存明文才是真正的危险，所以这里刻意不给任何默认值。
      # ⚠️ 值配错（非法 base64 / 长度不对）会让应用**启动失败**——宁可起不来，
      # 也不要先写进一批"换对 KEK 也解不开"的密文。
      # ⚠️ KEK 泄露 ⇒ 库里全部凭据密文等同于明文；只从环境变量注入，勿写入仓库。
      # 生成方式见 .env.example。
      kek: ${NEXUS_SECURITY_CRYPTO_KEK:}
    login:
      # 登录失败限制：同一用户名在 window 内失败 max-failures 次 → 冻结 lock-duration。
      # 诚实代价：按用户名冻结意味着攻击者可以用错密码把某个账号锁住（定向 DoS）。
      # 窗口与冻结都取 15 分钟，是为了让这种骚扰的恢复时间可接受。
      max-failures: ${NEXUS_LOGIN_MAX_FAILURES:5}
      window: ${NEXUS_LOGIN_FAILURE_WINDOW:15m}
      lock-duration: ${NEXUS_LOGIN_LOCK_DURATION:15m}
    register:
      # 注册入口按来源 IP 限流：批量注册是账号体系的常见滥用方式。
      # ⚠️ 反向代理之后 getRemoteAddr() 拿到的是代理地址，届时全体用户共用一个桶。
      # 本期刻意**不**信任 X-Forwarded-For（伪造它比伪造 IP 简单），
      # 部署到代理后面时必须先配好可信代理链，见 docs/decisions.md ADR-020。
      per-hour-per-ip: ${NEXUS_REGISTER_PER_HOUR:10}
    rate-limit:
      # 用户级每分钟请求上限。作用范围刻意**不是**"所有已认证接口"，而是
      # "quota.paths 里的模型入口" + 下面这几个敏感路径：
      # 20 次/分钟对人是宽松的，但一个页面同时发十几个请求就够呛，
      # 把普通读接口也罩进去，用户会在毫无成本的地方撞 429——那种限流只会招骂。
      per-minute: ${NEXUS_RATE_LIMIT_PER_MINUTE:20}
      extra-paths:
        # 改密码接口值得单独限流：它是唯一能用"已认证身份"去暴力试原密码的入口。
        # 注意它只受每分钟请求数约束，**不计入** token 配额（改密码不花钱）。
        - /api/users/me/password
    quota:
      # 每日额度。只统计"会花掉模型钱"的路径（见 paths），
      # 读接口、上传、改密码都不消耗额度 —— 把不花钱的操作也算进去，
      # 用户会在毫无成本的地方撞到配额，那种限流只会招骂。
      daily-requests: ${NEXUS_QUOTA_DAILY_REQUESTS:200}
      daily-tokens: ${NEXUS_QUOTA_DAILY_TOKENS:200000}
      paths:
        # 这份清单是**架构事实**而不是旋钮：每加一条，就多一个"用户能用它烧钱"的入口。
        # 新增模型调用接口时必须同步这里，否则新接口天然免配额（静默漏洞）。
        #
        # ⚠️ 这里**刻意不写 `/api/chat/**`**（初稿就是那么写的，是错的）：
        # 那条通配会把"读历史消息 / 列出会话 / 删除会话 / 停止生成"一并算进当日额度，
        # 于是一屏里的几次用户操作就能无声地吃掉额度——正是上面那句"不花钱的操作
        # 不该撞配额"要避免的事，而且用户看到的「今日 N/200 次」也不再等于"问了几次"。
        # 真机 E2E 里"刚进对话页就显示 1/200"就是这个通配的痕迹。
        # 代价：/api/chat 下的读接口不受限速约束——它们只查库、不调用模型。
        - /api/chat/stream
        - /api/chat/conversations/*/messages
        - /api/knowledge-bases/*/ask
        - /api/knowledge-bases/*/ask/stream
        - /api/agent/ask
        - /api/agents/*/test-chat
        # MCP 直连（外部 LLM 客户端）：不占对话额度
        - /mcp
  chat:
    memory:
      # 会话记忆窗口大小（条）。太大：浪费 Token 且可能超出上下文；
      # 太小：多轮对话"记不住"。20 是 Spring AI 的默认值，先沿用并留出可调入口。
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
  storage:
    # 原始文件存储根目录（增量同步要重新解析已导入的文件，因此必须留一份原文）
    root: ${NEXUS_STORAGE_ROOT:./data}
    # 知识库存储配额。口径是 kb_document.file_size（原始文件字节）之和，
    # 不是解析后的正文、更不是向量体积：用户能理解"这个 PDF 有 12 MB"，
    # 理解不了"你占了 37 MB 的 chunk 行"。
    # 配成 0 或负数表示该维度**不限**（临时放开时不必改代码）。
    quota:
      total-bytes: ${NEXUS_STORAGE_TOTAL_BYTES:5368709120}
      per-knowledge-base-bytes: ${NEXUS_STORAGE_PER_KB_BYTES:1073741824}
  import:
    # async：投递到 RabbitMQ（需要 broker，local/prod 默认）
    # sync ：当前线程直接执行（standalone / 测试：环境里没有 broker）
    mode: ${NEXUS_IMPORT_MODE:async}
  notify:
    # 每个用户最多几个通知通道。上限的作用不是省钱，而是让"通道"保持可枚举：
    # 一个用户挂 200 个 Webhook 时，一次导入完成会打 200 个外部请求。
    max-channels: ${NEXUS_NOTIFY_MAX_CHANNELS:10}
    webhook:
      # 投递超时。给得短：导入线程是同步投递，等太久会拖慢任务收尾。
      timeout: ${NEXUS_NOTIFY_WEBHOOK_TIMEOUT:5s}
      # 是否允许回调地址指向本机/内网。默认 false（Webhook 地址由用户输入，指内网等于 SSRF）；
      # standalone / test 打开，否则本地没法验证投递。
      allow-private-endpoints: ${NEXUS_NOTIFY_ALLOW_PRIVATE:false}
  automation:
    # 自动化调度：@Scheduled 扫 next_run_at <= now 且 enabled 的任务，
    # 用 UPDATE ... WHERE next_run_at = 期望值 做 CAS 抢占，多实例部署时同一时刻
    # 只有一个实例能抢到同一条任务（抢不到的那条 UPDATE 影响 0 行，直接跳过）。
    scheduler-enabled: ${NEXUS_AUTOMATION_SCHEDULER:true}
    # 扫描间隔。默认 30s：小时级任务对 30s 抖动不敏感，再密只是空转。
    sweep-interval-ms: ${NEXUS_AUTOMATION_SWEEP_INTERVAL_MS:30000}
    # 首次扫描延迟：等 Flyway / 缓存都就绪，避免启动瞬间抢跑。
    sweep-initial-delay-ms: ${NEXUS_AUTOMATION_SWEEP_INITIAL_DELAY_MS:15000}
    # 单次扫描最多抢几个：停机一天后不该把积压一次性全打出去（配额与模型都受不了）。
    sweep-batch-size: ${NEXUS_AUTOMATION_SWEEP_BATCH:20}
    # 失败重试只针对调度触发：手动触发时用户就在屏幕前，重试会让"立即运行"不可预期。
    max-retries: ${NEXUS_AUTOMATION_MAX_RETRIES:2}
    retry-delay-ms: ${NEXUS_AUTOMATION_RETRY_DELAY_MS:60000}
  # 模型价格（元 / 每 100 万 token），只服务于 /api/observability 的成本估算。
  # 键就是供应商返回的模型名（不是角色名：角色会随配置改，模型名才是账单上的那个）。
  # 没配的模型成本一律返回 null 而不是 0——0 会让报表看起来像"这个模型免费"，
  # null 才会被读成"缺配置"，这是本配置存在的唯一理由。
  # 模型名里带点（如 gpt-4.1）时，中括号写法才不会被当成层级分隔符：
  #   nexus.pricing.[gpt-4.1].input
  #
  # 默认留空：宁可在观测页看到"—（未配价格）"，也不编一个数字。
  # 示例（按供应商当前价填写，单位：元 / 1M token）：
  #   deepseek-chat:
  #     input: 2.0
  #     output: 8.0
  pricing: {}
  mcp:
    # 连接外部 MCP server 的单次超时（毫秒）。它同时是 probe 与工具调用的上限：
    # 一次 tools/call 卡住不该把整个对话回合拖死，超时要明确报错，而不是无限等。
    timeout-ms: ${NEXUS_MCP_TIMEOUT_MS:15000}
    # 本机 stdio 传输的开关，默认关闭。
    # 打开它意味着：用户填在网页上的"命令行"会被服务器真的执行。
    # 这是 stdio 传输本身固有的语义（它没有别的形态），所以只能由部署者决定要不要给这个能力；
    # 关闭时对应用户的配置会明确收到"stdio 已被服务端关闭"，而不是一个看不懂的连接失败。
    stdio-enabled: ${NEXUS_MCP_STDIO_ENABLED:false}
  vector:
    # 向量库（PostgreSQL + pgvector）。standalone / 测试环境没有它，会被关掉；
    # 关闭时写入与检索会明确报 4003，而不是静默失败。
    enabled: ${NEXUS_VECTOR_ENABLED:true}
    datasource:
      url: ${NEXUS_VECTOR_URL:jdbc:postgresql://localhost:5433/nexus_vector}
      username: ${NEXUS_VECTOR_USER:nexus}
      password: ${NEXUS_VECTOR_PASSWORD:nexus_pwd}
  search:
    # 检索索引（Elasticsearch + IK 中文分词）。与向量库同理，缺失时明确报错。
    enabled: ${NEXUS_SEARCH_ENABLED:true}
    uris: ${NEXUS_ES_URIS:http://localhost:9200}
    # 对外暴露的是别名，物理索引名带时间戳，重建时原子切换（检索不中断）
    index-alias: ${NEXUS_ES_INDEX_ALIAS:nexus_chunk}
    analyzer:
      # 索引期用最细粒度（召回高），检索期用粗粒度（精确度高）—— IK 的推荐用法
      index: ${NEXUS_ES_INDEX_ANALYZER:ik_max_word}
      search: ${NEXUS_ES_SEARCH_ANALYZER:ik_smart}
  rag:
    # LLM 重排开关：关掉后保持召回顺序（重排失败时也会自动走这条路径）
    rerank-enabled: ${NEXUS_RAG_RERANK:true}
    # 重排超时：网关退化时（实测单次调用可能上百秒）宁可降级为召回顺序，也不让用户干等。
    # 5 秒的依据：实测重排一旦超过这个量级，等它的收益远小于等待成本
    # （它只是把顺序调得更好一点，而用户面对的是"白等"）。
    rerank-timeout-ms: ${NEXUS_RAG_RERANK_TIMEOUT_MS:5000}
    # 送进模型的资料块 Token 预算：超出时从最低分开始丢，并如实告知被截断的段数
    context-token-budget: ${NEXUS_RAG_CONTEXT_BUDGET:2000}
  retrieval:
    # 检索参数的**全局默认值**（Phase 3.2）：知识库没配、调用方也没传时用它。
    # 优先级：请求参数 > 知识库的 retrieval_top_k / similarity_threshold > 这里。
    # 建库时的默认值也读这里 —— 两处同源，避免"建库写 0.7、检索用 0.25"这种打架。
    top-k: ${NEXUS_RETRIEVAL_TOP_K:5}
    # 相似度下限默认取宽松值 0.25：阈值是"挡掉明显无关"的噪声下限，不是精排。
    # 真实联调中「缓存击穿怎么解决」的向量第一名是 0.7458，0.7 这条线离一条完全
    # 正确的命中只差 0.05，收紧会让 0.5~0.7 区间的正确笔记被静默丢弃
    # （表现是"知识库里明明有却答不出来"）。要收紧请按库调 similarity_threshold。
    similarity-threshold: ${NEXUS_RETRIEVAL_SIMILARITY_THRESHOLD:0.25}
    # 多库扇出的**整体**超时（Phase 5.5.1）。绑定多个知识库时它们并行召回，
    # 这是"全部库一共最多等多久"，不是"每个库各等 10 秒"。
    # 检索这一段一直是百毫秒级，所以撞到 10s 意味着下游某一环卡死了：
    # 那时宁可少一个库的资料（并如实告诉用户与模型"哪个库没搜到"），也不要让问答挂住。
    # 没有"并行度"旋钮是有意的：扇出跑在虚拟线程上，且绑库数有硬上限，旋钮会是假旋钮。
    fanout-timeout: ${NEXUS_RETRIEVAL_FANOUT_TIMEOUT:10s}

# ============================================================
# 模型可替换层（ADR-003）
# 业务代码只认 ai.roles 里的逻辑角色，不认具体模型：
#   换模型   = 改 roles 里的一行
#   换供应商 = 加一个 provider 块（或改 base-url）
# 无 API Key 时对应 provider 会被跳过并打 WARN，应用仍可启动；
# 真正用到该角色时才报 4006（配置问题），而不是让供应商返回晦涩的 401。
# ============================================================
ai:
  defaults:
    temperature: 0.7
  # Agent 工具循环的上限（一次生成里"模型 ↔ 工具"能来回几轮）。
  # 这里的值就是框架 DefaultToolCallingManager 的默认值（40 / 150），写出来是为了
  # ① 可查：排查"为什么只检索了 3 次就停了"不用去读框架源码；
  # ② 可调：答案里出现"工具调用次数超过上限"（错误码 5002）时，改这里即可，不用改代码；
  # ③ 可测：nexus-ai 的 ToolCallLimitTest 会真的把上限撞一次，证明它生效。
  #
  # ⚠️ 不要写成 spring.ai.tools.limits.*：那两个 key 只对"自动配置出来的 ChatModel"生效，
  #    而本项目关闭了模型自动配置（见上面 spring.ai.model.chat=none），模型由
  #    AiModelRegistry 手工构建。写在那里是假旋钮——改了没反应（见 decisions.md B.43）。
  tools:
    max-calls-per-tool-default: 40
    max-total-tool-calls: 150
  # 用户自带模型（BYOK）的约束。
  # 对话侧 BYOK（user_llm_config）不需要白名单——换对话模型只影响单次生成的文字。
  # 嵌入侧必须有白名单：嵌入模型决定**向量空间**，而向量列在建库时写死并冻结
  # （vector(1024)，ADR-008）。让用户随便填一个 768 维模型，等于允许写入宽度错的向量，
  # 而且不会报错，只会表现为"检索结果莫名其妙"。
  byok:
    embedding:
      # 允许用户配置的嵌入模型（provider:model）。加一项意味着"该模型的维度与端点
      # 已经过真实验证"，不是随手放宽的旋钮（见 docs/roadmap.md 路线 A 的验收标准）。
      # 默认只含百炼 text-embedding-v4：1024 维，与 vector(1024) 列和既有知识库冻结值一致。
      allowed-models:
        - bailian:text-embedding-v4
      # 首期唯一允许的维度。向量列是 vector(1024)，换维度必须新建列/表并重建索引
      # （db/vector-migration/V1__vector_store.sql）；多维度分表属路线 B，本轮不实施。
      # ⚠️ 单独改这个值而不迁移向量列，会让启用 BYOK 的用户新建的库全部写不进向量
      #    （会明确报维度不一致，不会静默写错数据）——两者必须一起迁移。
      required-dimensions: 1024
      # 白名单之外，还允不允许用户填自己的 OpenAI 兼容端点（Base URL + 模型名 + Key）？
      # 允许的话，保存时会用一次真实 /embeddings 探针校验「它确实返回 1024 维」——
      # 白名单是「平台验过、拿来即用」，自定义端点是「用户自证」（见 CustomEmbeddingProbe）。
      # 企业内网部署若只想开放平台这几种模型，把它设成 false 即可。
      allow-custom-endpoint: ${NEXUS_BYOK_EMBEDDING_ALLOW_CUSTOM:true}
      # 探针能不能访问内网/本机地址。默认 false：Base URL 是用户输入，
      # 允许它指向内网等于给了一个 SSRF 探测器。只有 local / standalone / test
      # （端点是本机桩服务）才打开。
      allow-private-endpoints: ${NEXUS_BYOK_EMBEDDING_ALLOW_PRIVATE:false}
  providers:
    # 当前接入 DeepSeek 官方 OpenAI 兼容 API。换供应商只需改 base-url / model / api-key。
    #
    # 重要：同一个网关内不同模型可能走不同协议端点（官方文档 "Endpoints" 表）：
    #   /chat/completions → OpenAI 兼容（DeepSeek / GLM / Kimi / MiMo …）
    #   /responses        → OpenAI Responses API（Grok / GPT-Luna / Muse Spark）
    #   /messages         → Anthropic 协议（Qwen3.8 / MiniMax）
    # 选模型不能只看效果，必须确认它属于哪种协议，否则要换 Spring AI 的 Anthropic 接入模块。
    - name: deepseek
      type: OPENAI_COMPATIBLE
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_CHAT_API_KEY:}
      # 自定义 User-Agent：标准做法，部分网关用它识别客户端。
      # 其它网关也在这里加各自的头（OpenRouter 的 HTTP-Referer、Azure 的 api-version、
      # OpenCode Zen 的 x-opencode-session——切回那家时把它加回来即可）。
      headers:
        User-Agent: ${AI_CHAT_USER_AGENT:nexus-knowledge-hub/0.1}
      models:
        - name: ${AI_CHAT_MODEL:deepseek-chat}
          # deepseek-chat 官方上下文窗口 64K（输出上限 8K）
          context-window: 65536
          capabilities: [CHAT, TOOL_CALLING, JSON]
        # 评测裁判：当前与对话模型同源（DeepSeek 一家）。要降偏差可换成另一家的便宜模型。
        - name: ${AI_JUDGE_MODEL:deepseek-chat}
          context-window: 65536
          capabilities: [CHAT, JSON]
    # 阿里云百炼（DashScope）OpenAI 兼容端点：云端嵌入模型 text-embedding-v4。
    #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   模型:    text-embedding-v4（支持 dimensions ∈ {2048,1536,1024,768,512,256,128,64}）
    #   鉴权:    Authorization: Bearer <DASHSCOPE_API_KEY>（Spring AI 自动加）
    # 没有 api-key 时，真正调到 embedding.default 才报 4006（启动不失败，对话不受影响）。
    #
    # 历史：本地 Ollama bge-m3 已下线。若要切回本地模型，把下面这个 ollama provider 块加回来
    #   - name: ollama
    #     type: OLLAMA
    #     base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    #     models:
    #       - name: bge-m3
    #         dimensions: 1024
    #         capabilities: [EMBEDDING]
    # 然后把 embedding.default 改成 "ollama:bge-m3"。代码里 OLLAMA 协议路径仍保留。
    - name: bailian
      type: OPENAI_COMPATIBLE
      base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_EMBEDDING_API_KEY:}
      models:
        - name: ${AI_EMBEDDING_MODEL:text-embedding-v4}
          # 维度必须与知识库冻结值一致；这里默认 1024，与原 bge-m3 同维，可平滑替换。
          dimensions: ${AI_EMBEDDING_DIM:1024}
          capabilities: [EMBEDDING]
  roles:
    chat.default: "deepseek:${AI_CHAT_MODEL:deepseek-chat}"
    chat.agent: "deepseek:${AI_CHAT_MODEL:deepseek-chat}"
    chat.judge: "deepseek:${AI_JUDGE_MODEL:deepseek-chat}"
    embedding.default: "bailian:${AI_EMBEDDING_MODEL:text-embedding-v4}"

logging:
  # 日志模板里带上 MDC 中的 requestId（由 RequestIdFilter 写入）：
  # 排查问题时只需用户提供响应头 X-Request-Id，即可捞出该请求的全部日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{40} - %msg%n"
  charset:
    # 显式声明编码，不依赖 JVM 默认值：
    # Java 19 起决定 stdout 编码的是 stdout.encoding（中文 Windows 默认 GBK），
    # 而不是 file.encoding，因此中文日志容易变成乱码。
    # 注意：终端也需要是 UTF-8（Windows Terminal 默认即是；旧 conhost 需先 chcp 65001）。
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.lky.nexus: DEBUG
