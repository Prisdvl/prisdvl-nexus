# ============================================================
# local —— 真实基础设施（docker compose）开发 profile
#
#   cd deploy && docker compose up -d      # 起 MySQL / PG / Redis / ES / RabbitMQ
#   java -jar nexus-app/target/nexus-app-0.0.1-SNAPSHOT.jar --spring.profiles.active=local
#
# 端口说明：本机已有原生 MySQL(3306) 与 PostgreSQL(5432)，
# 因此本项目容器映射到 3307 / 5433（见 deploy/docker-compose.yml）。
#
# 【关于"开发默认值"】这里的数据库口令与 JWT 密钥都是**仅用于本地开发**的默认值，
# 与 deploy/.env.example 保持一致，因此可以安全提交进仓库——目的是"clone 下来就能跑"。
# 生产 profile 不在本文件里，且 application.yml 中的密钥一律不设默认值（缺失即启动失败）。
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:nexus}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:nexus}
    password: ${MYSQL_PASSWORD:nexus_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: nexus-mysql-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      # 连接泄漏排查（Phase 11 会接监控）
      leak-detection-threshold: 20000

  # Flyway 接管 MySQL 的建表：V1 账号权限 / V2 会话消息 / V3 Spring AI 记忆表
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true          # 禁止 clean，避免误删数据
    table: flyway_schema_history

nexus:
  jwt:
    # 仅本地开发使用；生产必须通过环境变量 JWT_SECRET 提供
    secret: ${JWT_SECRET:local-dev-only-secret-please-change-in-production-32b}
  security:
    # local 有 compose 里的 nexus-redis（deploy/docker-compose.yml），因此走真 Redis。
    # 这是唯一默认开 Redis 的 profile —— standalone/test 都关着，
    # 所以"限流生效"这件事不能只靠 local 验证，否则测试环境里它其实是另一套实现。
    redis-enabled: true
    register:
      # ⚠️ 与 test / standalone 同一个坑：本机请求全来自 127.0.0.1，E2E 脚本每轮会自己
      # 注册临时账号，跑几轮就撞满 application.yml 里的默认 10 次/小时，
      # 而症状出现在**紧接着的登录 401**上（限流看起来像认证坏了）。
      # 开发环境放宽；生产（无 profile 覆盖）仍是 10。验真实阈值用 NEXUS_REGISTER_PER_HOUR=10。
      per-hour-per-ip: ${NEXUS_REGISTER_PER_HOUR:1000}

logging:
  level:
    com.lky.nexus: DEBUG
    # 迁移过程想看细节可打开
    # org.flywaydb: DEBUG
