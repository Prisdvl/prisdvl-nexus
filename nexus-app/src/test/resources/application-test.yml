# ============================================================
# 测试 profile：用 H2 内存库验证数据访问层，不依赖 Docker
# 目的：在基础设施（MySQL/Redis/ES via Docker）就绪之前，
#       尽早验证 MyBatis-Plus 3.5.17 与 Spring Boot 4.1.1 的兼容性。
# ============================================================
spring:
  datasource:
    # 库名带随机后缀：H2 内存库 + DB_CLOSE_DELAY=-1 时，**固定库名会让所有 Spring 上下文
    # 共用同一个数据库**，测试结果因此依赖执行顺序（真实踩坑：同一个唯一键冲突/查不到
    # 刚插入的数据，单独跑却全过）。加随机后缀后每个上下文各有一个干净的库。
    url: jdbc:h2:mem:nexus_test_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # ⚠️ 实测（复核于 Phase 4.1）：下面这份脚本**已经不会生效**——表是 Flyway 迁移建的，
      # 它全篇 CREATE TABLE IF NOT EXISTS，执行时全是空操作，且内容比迁移旧。
      # 保留它只为"改动面最小"，删除属独立清理项（见 docs/archive/reports/platform-phase3-baseline.md §1.7/§十.1）。
      schema-locations: classpath:db/h2/schema.sql
  flyway:
    # ⚠️ 这个开关**只关掉 Boot 自动配置的那套 Flyway**，关不掉主库迁移：
    # 主库 Flyway 是 PrimaryDataSourceConfig 手工声明的 Bean + FlywayMigrationInitializer，
    # 不看这个属性。实测启动日志里依旧 "Successfully applied 11 migrations … now at version v12"，
    # H2 测试库的表结构其实就是 MySQL 方言的迁移脚本（H2 MODE=MySQL 下能跑）。
    # 要真正关闭得给那个 Bean 加条件，而不是改这里。
    enabled: false

# 测试专用 JWT 密钥：仅测试使用，绝不用于任何真实环境
nexus:
  jwt:
    secret: test-only-jwt-secret-0123456789-abcdefghijklmnop
    issuer: nexus-test
    access-token-ttl: 30m
  email:
    # 测试 profile 允许 ConsoleEmailSender；领域单测也可自行注入 mock sender
    sender: console
  storage:
    # 原始文件落到 target 下（已被 .gitignore 忽略），避免污染仓库根目录
    root: ./target/test-storage
  notify:
    # 本机桩服务在 127.0.0.1 上；与上面 byok.embedding 同一个理由，测试里必须放开 SSRF 闸门
    webhook:
      allow-private-endpoints: true
  import:
    # 测试环境没有 broker：默认走同步执行，保证测试的确定性
    # （异步契约由 ImportTaskAsyncTest 通过替换 ImportTaskPublisher 单独验证）
    mode: sync
  automation:
    # 测试里关掉 @Scheduled：到点触发用例自己调 automationScheduler.sweepOnce()，
    # 否则后台线程会在断言中间插一脚，跑出"偶发多一条运行记录"这种不可复现的失败。
    scheduler-enabled: false
    # 重试零延迟：用例要验证"失败 → 排下一跳 → 再扫一次命中"，延迟为 0 才不用 sleep。
    retry-delay-ms: 0
  pricing:
    # 观测成本估算的单价（元 / 1M token）。用例要断言具体金额，所以这里必须给出真实数值；
    # 生产 application.yml 默认留空（没配价格的模型成本返回 null 而不是 0）。
    # 2.0 / 8.0 只是用例里的算术锚点，不代表任何供应商的实际报价。
    deepseek-chat:
      input: 2.0
      output: 8.0
  mcp:
    # 用例只验证 http 传输（本地起一个 HttpServer 假 server）；stdio 会在测试机上真的执行命令，
    # 所以显式关掉——顺便钉住"关闭时必须给出明确原因"这条契约。
    stdio-enabled: false
    # 3 秒足够本地假 server 应答，又能在"连不上"的用例里快速失败（不会卡满 15 秒）。
    timeout-ms: 3000
  vector:
    # 测试环境不启动 PostgreSQL：向量库关闭（相关用例用 DisabledVectorStore 验证报错行为，
    # 真实 pgvector 读写由 AI_VECTOR_LIVE=true 的守卫测试覆盖）
    enabled: false
  search:
    # 同理：测试环境不启动 Elasticsearch（真实 ES 联调由 AI_SEARCH_LIVE=true 的守卫测试覆盖）
    enabled: false
  security:
    # 显式写出来（主配置的默认值也是 false）：测试绝不依赖 Redis，
    # 限流/配额/令牌版本一律走 InMemorySecurityStore，因此 `mvn test` 不需要任何外部进程。
    # 想验 Redis 那条实现路径只有一条路：起 standalone + 命令行打开开关。
    redis-enabled: false
    crypto:
      # 测试专用 KEK（base64 的 32 字节）：仅测试使用，绝不用于任何真实环境。
      # 主配置默认为空 ⇒ 写入路径 fail-closed；测试必须给一把，否则保存「模型 Key」的用例全崩。
      # 「未配置 KEK 时 fail-closed」这一分支由 CredentialCipherTest 直接构造对象来覆盖。
      kek: FBsiKTA3PkVMU1phaG92fYSLkpmgp661vMPK0djf5u0=
    register:
      # ⚠️ 必须放宽，理由是一次真实的踩坑：测试全都从 127.0.0.1 发起，
      # AgentResourceTest 一个类就有 17 个用例、每个都注册一个账号。
      # 默认 10 次/小时会在第 11 个用例开始返回 429，而**症状出现在别处**——
      # 注册失败后紧接着的登录自然拿到 401（用户压根没建成），
      # 于是报错是"登录 401"，排查方向会完全跑偏。
      # 注册限流本身由 RegisterRateLimitTest 用自己的 properties 压到 2 来验证。
      per-hour-per-ip: 1000
    rate-limit:
      # 同理：模型入口的 20 次/分钟上限在多用例共用一个账号的测试里容易被撞到。
      # 限流行为由 RateLimitQuotaTest 显式置 0 验证，这里不影响其他用例。
      per-minute: 1000
    quota:
      # 配额默认值（200 次 / 20 万 token）对测试足够宽松，保持不动；
      # 用尽行为由 QuotaExhaustedTest 显式置 0 验证。
      daily-requests: 1000

management:
  health:
    rabbit:
      enabled: false
    # Redis starter 带来的健康指示器会真去连 6379：测试机没装 Redis 时它就是 DOWN，
    # 而测试恰恰不应该依赖外部基础设施。
    redis:
      enabled: false

# 测试用模型配置：
# 覆盖 providers 列表（Spring Boot 中 profile 的 list 会整体替换，不是合并），
# 用一个明显是假值的 api-key，让注册表能够构建模型对象（构建不发起网络请求）。
#
# 【隔离说明】这里把 embedding.default 钉成 bailian:text-embedding-v4，与生产选型一致，
# 并与 KnowledgeBaseFlowTest 等用例按 ADR-008 做的「冻结嵌入模型」断言对齐。
# 曾经钉的是 ollama:bge-m3（本地 Ollama 方案），那个方案已完全弃用，只保留代码里的 OLLAMA 协议支持。
# 假 Key 只是为了让注册表能构建模型对象；真实调用由 LiveEmbeddingTest 守卫（需 AI_EMBEDDING_LIVE + 真 Key）。
ai:
  defaults:
    temperature: 0.7
  byok:
    embedding:
      # 测试夹具：**两项**白名单。第二项（text-embedding-v3）只用于验证一条关键路径——
      # "用户把配置换成另一个合法模型后，冻结在第一个模型上的旧知识库必须被拒绝"，
      # 生产默认只有 bailian:text-embedding-v4（见 main/resources/application.yml）。
      # 两个模型都是 1024 维：白名单约束的是 (provider, model)，维度由 required-dimensions 单独钉住。
      allowed-models:
        - bailian:text-embedding-v4
        - bailian:text-embedding-v3
      required-dimensions: 1024
      # 测试默认**关掉**自定义端点：既有用例断言「白名单外的模型被拒」，
      # 打开后那条路径会去真发探针请求，测试就依赖外网了。
      # 需要验证自定义端点的那支用例用 @SpringBootTest(properties=...) 单独打开。
      allow-custom-endpoint: false
      # 本机桩服务在 127.0.0.1 上，SSRF 闸门在测试里必须放开（生产默认是关的）
      allow-private-endpoints: true
  roles:
    chat.default: "deepseek:${AI_CHAT_MODEL:deepseek-chat}"
    chat.agent: "deepseek:${AI_CHAT_MODEL:deepseek-chat}"
    chat.judge: "deepseek:${AI_JUDGE_MODEL:deepseek-chat}"
    embedding.default: "bailian:${AI_EMBEDDING_MODEL:text-embedding-v4}"
  providers:
    - name: deepseek
      type: OPENAI_COMPATIBLE
      # 支持用环境变量切供应商：AI_CHAT_BASE_URL / AI_CHAT_MODEL / AI_CHAT_API_KEY
      # 未设置时用假 Key（构建模型不发请求，所以测试照常通过；真实调用由 LiveModelCallTest 守卫）
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_CHAT_API_KEY:sk-test-dummy-key-not-a-real-credential-0123456789}
      headers:
        User-Agent: ${AI_CHAT_USER_AGENT:nexus-knowledge-hub/0.1}
      models:
        - name: ${AI_CHAT_MODEL:deepseek-chat}
          context-window: 65536
          capabilities: [CHAT, TOOL_CALLING, JSON]
    # 嵌入：与主配置同为百炼 text-embedding-v4（1024 维，与知识库冻结维度一致）。
    # 假 Key 让构建不发起请求；真实调用由 LiveEmbeddingTest 守卫。
    - name: bailian
      type: OPENAI_COMPATIBLE
      base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_EMBEDDING_API_KEY:sk-test-dummy-key-not-a-real-credential-0123456789}
      models:
        - name: ${AI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: ${AI_EMBEDDING_DIM:1024}
          capabilities: [EMBEDDING]

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.lky.nexus: DEBUG
