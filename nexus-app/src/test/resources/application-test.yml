# ============================================================
# 测试 profile：用 H2 内存库验证数据访问层，不依赖 Docker
# 目的：在基础设施（MySQL/Redis/ES via Docker）就绪之前，
#       尽早验证 MyBatis-Plus 3.5.17 与 Spring Boot 4.1.1 的兼容性。
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:nexus_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # 与 standalone 开发 profile 共用同一份建表脚本，避免两套 DDL 漂移
      schema-locations: classpath:db/h2/schema.sql
  flyway:
    # 迁移脚本是 MySQL 方言，H2 测试中关闭；真实迁移在 Step 0.6 用 MySQL 验证
    enabled: false

# 测试专用 JWT 密钥：仅测试使用，绝不用于任何真实环境
nexus:
  jwt:
    secret: test-only-jwt-secret-0123456789-abcdefghijklmnop
    issuer: nexus-test
    access-token-ttl: 30m
  storage:
    # 原始文件落到 target 下（已被 .gitignore 忽略），避免污染仓库根目录
    root: ./target/test-storage

# 测试用模型配置：
# 覆盖 providers 列表（Spring Boot 中 profile 的 list 会整体替换，不是合并），
# 用一个明显是假值的 api-key，让注册表能够构建模型对象（构建不发起网络请求）。
ai:
  defaults:
    temperature: 0.7
  providers:
    - name: opencode
      type: OPENAI_COMPATIBLE
      # 支持用环境变量切供应商：AI_CHAT_BASE_URL / AI_CHAT_MODEL / AI_CHAT_API_KEY
      # 未设置时用假 Key（构建模型不发请求，所以测试照常通过；真实调用由 LiveModelCallTest 守卫）
      base-url: ${AI_CHAT_BASE_URL:https://opencode.ai/zen/go/v1}
      api-key: ${AI_CHAT_API_KEY:sk-test-dummy-key-not-a-real-credential-0123456789}
      headers:
        User-Agent: ${AI_CHAT_USER_AGENT:nexus-knowledge-hub/0.1}
        x-opencode-session: ${AI_CHAT_SESSION_ID:nexus-test-session}
      models:
        - name: ${AI_CHAT_MODEL:deepseek-v4-flash}
          context-window: 65536
          capabilities: [CHAT, TOOL_CALLING, JSON]
    # 嵌入模型：知识库创建时会把它冻结进 kb_knowledge_base（ADR-008），
    # 因此测试 profile 必须提供，否则建库会报 4006。
    - name: ollama
      type: OLLAMA
      base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
      models:
        - name: bge-m3
          dimensions: 1024
          capabilities: [EMBEDDING]

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.lky.nexus: DEBUG
