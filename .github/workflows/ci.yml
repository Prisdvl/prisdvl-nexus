# Minimal CI: backend unit/integration tests, frontend build, compose config check.
# Does NOT call real LLM APIs, does NOT start the full 7-service stack.
name: CI

on:
  push:
    branches: [main, platform-phase3]
  pull_request:
    branches: [main, platform-phase3]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run default tests (LIVE suites stay skipped without live env)
        run: mvn -B test
        env:
          # Keep CI deterministic: do not enable LIVE gates or inject personal keys.
          MAVEN_OPTS: -Xmx1024m

  frontend:
    name: Frontend (npm build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + production build
        run: npm run build

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose with CI-only placeholders
        env:
          # Non-production placeholders so ${VAR:?…} interpolate; no real secrets.
          JWT_SECRET: ci-only-placeholder-secret-at-least-32-bytes-long!!
          AI_CHAT_API_KEY: ci-placeholder-chat-key
          AI_EMBEDDING_API_KEY: ci-placeholder-embed-key
        run: docker compose config --quiet
