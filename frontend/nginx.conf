# ============================================================
# prisdvl-nexus 前端站点配置（Phase 5.7）
#
# 这个文件替换的是 nginx 官方镜像自带的 /etc/nginx/conf.d/default.conf。
# 每一条都不是"顺手加的"，对应一个具体的部署故障，下面逐条写明。
# ============================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 字符集：中文标题/文件名不乱码
    charset utf-8;

    # ------------------------------------------------------------
    # 【1】入口地址解析
    #
    # 用变量 + resolver 而不是直接写 proxy_pass http://backend:8080：
    # 直接写死时 nginx 在**启动那一刻**解析一次 DNS 就把 IP 缓存到进程结束。
    # backend 容器被重建（docker compose up -d 改了镜像、或 down/up）后 IP 会变，
    # 而 nginx 还朝着旧 IP 发请求 → 502，直到手动 reload。
    # 127.0.0.11 是 Docker 内嵌 DNS；valid=10s 让变更在 10 秒内生效。
    # ------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # ------------------------------------------------------------
    # 【2】上传体积
    #
    # nginx 默认 client_max_body_size = 1m。知识库原文上传是 200MB
    # （application.yml: spring.servlet.multipart.max-file-size=200MB），
    # 不放开就是"后端没收到请求就 413"。220m 与后端 max-request-size 对齐。
    # ------------------------------------------------------------
    client_max_body_size 220m;
    # 大文件不要让 nginx 先落盘缓冲：直接透传给后端（配合下面的 request_buffering off）
    client_body_buffer_size 1m;

    # 静态资源：带 hash 的产物可以长缓存，index.html 不能（否则换版本白屏）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    # 注意这里**没有** text/event-stream：SSE 必须逐帧到达，压缩会引入缓冲
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------
    # 【3】SSE 流式端点（本项目共两条，全在 /api 下）
    #   POST /api/chat/stream
    #   POST /api/knowledge-bases/{id}/ask/stream
    #
    # nginx 默认 proxy_buffering on：它会把上游的响应攒成块再发给浏览器，
    # 于是"逐字流式"退化成"最后一次性吐出"——功能看着正常，体验全丢。
    # 而且应用**没有**发 X-Accel-Buffering: no（那是 nginx 专有头，业务代码不该知道
    # nginx 存在），所以必须在 nginx 侧关掉。
    #
    # 超时同理：默认 proxy_read_timeout 60s，指的是"两次读取之间"的间隔。
    # 长回答 + 慢模型时两次事件之间可能超过 60s，连接会被掐断，前端表现为
    # 流莫名其妙中断。这里给 3600s（够一次超长回答，又不至于永久占着连接）。
    # ------------------------------------------------------------
    location ~ ^/api/(chat/stream|knowledge-bases/[0-9]+/ask/stream)$ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        # 关掉响应缓冲（核心）与请求缓冲；关掉分块合并，保证每帧即到
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Connection 置空 = 走长连接，不要每帧重连
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    # ------------------------------------------------------------
    # 【4】普通 API
    #
    # 上传走这里：proxy_request_buffering off 让 200MB 原文边收边转发，
    # 不在 nginx 磁盘上先落一份（省一份 IO 与空间）。
    # proxy_read_timeout 300s：同步导入/嵌入接口在真机上可能跑几分钟。
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # ------------------------------------------------------------
    # 【5】MCP 端点（POST /mcp，见 McpEndpoint）
    # 与 /api 同源同策略，单独列出是因为它不在 /api 前缀下
    # ------------------------------------------------------------
    location /mcp {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 健康检查用的静态探针（compose 的 frontend healthcheck 打 /healthz）：
    # 不打 `/`，因为 `/` 会被 SPA fallback 接管，无论如何都返回 index.html，
    # 那样"nginx 活着"与"dist 还在"就分不清了。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------
    # 【6】SPA fallback
    #
    # 前端是 history 路由：直接访问 /knowledge/3 或刷新页面时，那个路径在磁盘上
    # 并不存在，nginx 会 404。try_files 先找真实文件，找不到就交给 index.html，
    # 由 vue-router 解析。
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
